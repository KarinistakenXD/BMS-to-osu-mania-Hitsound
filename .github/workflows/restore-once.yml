name: Final source restore

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore complete project source
        shell: bash
        run: |
          set -euxo pipefail
          cat bootstrap/source-xz.part*.b64 | tr -d '\r\n' | base64 -d > /tmp/source.tar.xz
          echo "3a143e08accb02480170bfc49f678e09990ea9fde6db9623f92b1693a087a54d  /tmp/source.tar.xz" | sha256sum -c -
          mkdir -p /tmp/restored
          tar -xJf /tmp/source.tar.xz -C /tmp/restored
          cp -a /tmp/restored/. .

          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.build ??= {};
          p.build.win ??= {};
          p.build.win.icon = 'build/icon.ico';
          p.build.nsis ??= {};
          p.build.nsis.installerIcon = 'build/icon.ico';
          p.build.nsis.uninstallerIcon = 'build/icon.ico';
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE

          rm -rf bootstrap payload
          rm -f .github/workflows/restore-once.yml
          rm -f .github/workflows/bootstrap-source.yml
          rm -f .github/workflows/bootstrap-and-build.yml
          rm -f .github/workflows/archive-diagnostics.yml

      - name: Commit complete project source
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish complete project source"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
