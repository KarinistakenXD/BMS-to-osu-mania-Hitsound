name: Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BMS-to-osu-mania-Hitsound-windows-x64
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: error

      - name: Read package version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" release/*.exe --clobber 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" release/*.exe --title "BMS to osu!mania Hitsound ${{ github.ref_name }}" --generate-notes
          }

      - name: Create first version release from main
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "$tag already exists; leaving the published release unchanged."
            exit 0
          }
          gh release create $tag release/*.exe --target "$env:GITHUB_SHA" --title "BMS to osu!mania Hitsound $tag" --notes "First Windows release of BMS to osu!mania Hitsound. Download the x64 Setup .exe below. FFmpeg is requested in-app when a feature requires it."
