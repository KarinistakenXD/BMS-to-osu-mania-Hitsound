name: Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Verify preview cache and renderer
        run: |
          npm test
          npm run typecheck:renderer
          npx electron tests/preview-electron.cjs

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BMS-to-osu-mania-Hitsound-windows-x64
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: error

      - name: Read package version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "release-notes/${{ github.ref_name }}.md"
          $noteArgs = @("--generate-notes")
          if (Test-Path -LiteralPath $notes) { $noteArgs = @("--notes-file", $notes) }
          gh release upload "${{ github.ref_name }}" release/*.exe --clobber 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" release/*.exe --title "BMS to osu!mania Hitsound ${{ github.ref_name }}" @noteArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } elseif (Test-Path -LiteralPath $notes) {
            gh release edit "${{ github.ref_name }}" --notes-file $notes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Publish current version hotfix from main
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          $notes = "release-notes/$tag.md"
          $noteArgs = @("--generate-notes")
          if (Test-Path -LiteralPath $notes) { $noteArgs = @("--notes-file", $notes) }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" -f "sha=$env:GITHUB_SHA" -F force=true
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release upload $tag release/*.exe --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (Test-Path -LiteralPath $notes) {
              gh release edit $tag --notes-file $notes
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            exit 0
          }
          gh release create $tag release/*.exe --target "$env:GITHUB_SHA" --title "BMS to osu!mania Hitsound $tag" @noteArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
